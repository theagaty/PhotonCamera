name: Photon 1.27.2.2 + LUT 200 Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'hybrid/1.27.2.2-lut-200'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out Photon 1.27.2.2 hybrid branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Hinnka LUT 200% feature commit
        run: |
          git fetch https://github.com/bjzhou/PhotonCamera.git a81be3ddf8cdf79d1cd3bbb3d6273b2f5523d1db
          git cherry-pick --no-commit a81be3ddf8cdf79d1cd3bbb3d6273b2f5523d1db

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required NDK and CMake
        run: sdkmanager 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build default debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-1.27.2.2-lut-200-debug
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error
