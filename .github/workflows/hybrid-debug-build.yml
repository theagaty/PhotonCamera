name: Photon Hybrid Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'hybrid/**'
    paths:
      - 'patches/**'
      - '.github/workflows/hybrid-debug-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out Photon base
        uses: actions/checkout@v4

      - name: Apply Photon Hybrid patches
        run: |
          git apply --check patches/0001-restore-classic-bayer-raw.patch
          git apply patches/0001-restore-classic-bayer-raw.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required NDK and CMake
        run: sdkmanager 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build default debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace

      - name: Upload Photon Hybrid APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-hybrid-1.28.1-debug
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error
