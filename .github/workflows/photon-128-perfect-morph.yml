name: Photon 1.28.2.1 Perfect Morph

on:
  workflow_dispatch:
  push:
    branches:
      - 'hybrid/1.28.2.1-perfect-morph-v1'

concurrency:
  group: photon-perfect-morph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out Perfect Morph branch
        uses: actions/checkout@v4

      - name: Verify Perfect Morph invariants
        shell: bash
        run: |
          grep -q 'MorphAssistSettings' app/src/main/java/com/hinnka/mycamera/ui/camera/CameraScreen.kt
          grep -q 'rotationDegrees = morphGridRotation' app/src/main/java/com/hinnka/mycamera/ui/camera/CameraScreen.kt
          grep -q '0.20f' app/src/main/java/com/hinnka/mycamera/ui/camera/LevelIndicatorOverlay.kt
          grep -q 'SCREEN_ORIENTATION_FULL_SENSOR' app/src/main/java/com/hinnka/mycamera/MainActivity.kt
          grep -q 'fun exportOriginalImage' app/src/main/java/com/hinnka/mycamera/gallery/GalleryManager.kt
          grep -q 'fun renderSelectedPhotos' app/src/main/java/com/hinnka/mycamera/viewmodel/GalleryViewModel.kt
          grep -q 'fun renderPhotoAsJpeg' app/src/main/java/com/hinnka/mycamera/viewmodel/GalleryViewModel.kt
          grep -q '<string name="render">Render</string>' app/src/main/res/values/strings.xml
          grep -q 'CustomSlider(' app/src/main/java/com/hinnka/mycamera/ui/components/ColorRecipePanel.kt
          grep -q 'fun undoEdit' app/src/main/java/com/hinnka/mycamera/viewmodel/GalleryViewModel.kt
          grep -q 'fun redoEdit' app/src/main/java/com/hinnka/mycamera/viewmodel/GalleryViewModel.kt
          grep -q 'fun resetAllEdits' app/src/main/java/com/hinnka/mycamera/viewmodel/GalleryViewModel.kt
          grep -q 'edit_reset_all' app/src/main/java/com/hinnka/mycamera/ui/gallery/GalleryEditScreen.kt
          grep -q 'fun revertCurrentPhotoToOriginal' app/src/main/java/com/hinnka/mycamera/viewmodel/GalleryViewModel.kt
          grep -q 'suspend fun revertPhotoToOriginal' app/src/main/java/com/hinnka/mycamera/gallery/GalleryManager.kt
          grep -q 'perfectMorph.revertBaseline.v1' app/src/main/java/com/hinnka/mycamera/gallery/MorphRevertBaseline.kt
          grep -q 'current.copy(' app/src/main/java/com/hinnka/mycamera/gallery/MorphRevertBaseline.kt
          if grep -q 'exportedUris[[:space:]]*=' app/src/main/java/com/hinnka/mycamera/gallery/MorphRevertBaseline.kt; then
            echo 'Revert baseline must never overwrite exportedUris'
            exit 1
          fi
          grep -q 'edit_revert_original' app/src/main/java/com/hinnka/mycamera/ui/gallery/GalleryEditScreen.kt
          grep -q 'SPATIAL_BAYER' app/src/main/java/com/hinnka/mycamera/processor/MultiFrameStacker.kt
          grep -q 'Spatial Bayer \[Advanced\]' app/src/main/java/com/hinnka/mycamera/gallery/GalleryManager.kt
          grep -q 'ImageLayout.CFA' app/src/main/java/com/hinnka/mycamera/gallery/GalleryManager.kt
          grep -q 'settings_raw_max_mode_spatial_bayer' app/src/main/java/com/hinnka/mycamera/ui/settings/SettingsScreen.kt
          git show --check --oneline --no-patch HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install required NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run Perfect Morph regression tests
        run: |
          ./gradlew testDefaultDebugUnitTest --stacktrace \
            --tests com.hinnka.mycamera.processor.MgcMergeMethodTest \
            --tests com.hinnka.mycamera.gallery.MorphRevertBaselineTest \
            --tests com.hinnka.mycamera.gallery.PostEditGeometryTest \
            --tests com.hinnka.mycamera.viewmodel.MultiFrameOutputScaleTest

      - name: Build default debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-1.28.2.1-perfect-morph-debug
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error
