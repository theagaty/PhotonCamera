name: Photon 1.27.2.2 Custom Refinements Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'hybrid/1.27.2.2-refinements-v4'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out custom Photon 1.27.2.2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Hinnka LUT 200% feature commit
        shell: bash
        run: |
          git fetch https://github.com/bjzhou/PhotonCamera.git a81be3ddf8cdf79d1cd3bbb3d6273b2f5523d1db

          set +e
          git cherry-pick --no-commit a81be3ddf8cdf79d1cd3bbb3d6273b2f5523d1db
          CHERRY_STATUS=$?
          set -e

          if [ "$CHERRY_STATUS" -ne 0 ]; then
            echo "Resolving expected LUT 200 compatibility conflicts against 1.27.2.2..."

            git checkout --ours -- app/src/main/java/com/hinnka/mycamera/ui/components/ColorRecipePanel.kt
            git checkout --ours -- app/src/main/java/com/hinnka/mycamera/viewmodel/CameraViewModel.kt
            git checkout --theirs -- app/src/main/java/com/hinnka/mycamera/ui/components/LutIntensitySlider.kt

            python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/hinnka/mycamera/viewmodel/CameraViewModel.kt')
          text = path.read_text()
          old = 'intensity.coerceIn(0f, 1f)'
          if old in text:
              if 'import com.hinnka.mycamera.model.RecipeParam' not in text:
                  anchor = 'import com.hinnka.mycamera.model.LutSelectorMode\n'
                  if anchor not in text:
                      raise SystemExit('Could not find RecipeParam import anchor')
                  text = text.replace(anchor, anchor + 'import com.hinnka.mycamera.model.RecipeParam\n', 1)
              text = text.replace(old, 'RecipeParam.LUT_INTENSITY.clamp(intensity)')
              path.write_text(text)
          PY

            git add app/src/main/java/com/hinnka/mycamera/ui/components/ColorRecipePanel.kt
            git add app/src/main/java/com/hinnka/mycamera/ui/components/LutIntensitySlider.kt
            git add app/src/main/java/com/hinnka/mycamera/viewmodel/CameraViewModel.kt
            git cherry-pick --quit || true
          fi

          grep -q 'LUT_INTENSITY(R.string.recipe_param_lut_intensity, 0.0f, 2.0f, 1f)' app/src/main/java/com/hinnka/mycamera/model/ColorRecipe.kt
          grep -q 'valueRange = param.minValue..param.maxValue' app/src/main/java/com/hinnka/mycamera/ui/components/LutIntensitySlider.kt

      - name: Apply custom assist refinements
        run: |
          python3 hybrid/apply_refinements.py
          grep -q 'HybridGridOverlay' app/src/main/java/com/hinnka/mycamera/ui/camera/CameraScreen.kt
          grep -q 'HybridLevelIndicatorOverlay' app/src/main/java/com/hinnka/mycamera/ui/camera/CameraScreen.kt
          grep -q 'HybridAssistSettingsPanel' app/src/main/java/com/hinnka/mycamera/ui/settings/SettingsScreen.kt
          grep -q 'HybridSettingsOrientationEffect' app/src/main/java/com/hinnka/mycamera/ui/settings/SettingsScreen.kt
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required NDK and CMake
        run: sdkmanager 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build default debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-1.27.2.2-custom-refinements-debug
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error
